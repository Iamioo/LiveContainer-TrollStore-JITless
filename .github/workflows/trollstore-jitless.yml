name: TrollStore JIT-less (experimental)
on:
  workflow_dispatch:
  push:
    branches: [trollstore-jitless]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Archive
        run: |
          set -o pipefail
          python3 TrollStoreJITLess/prepare-icon.py
          xcodebuild archive -project LiveContainer.xcodeproj -scheme LiveContainer \
            -archivePath "$RUNNER_TEMP/LiveContainer.xcarchive" -sdk iphoneos -arch arm64 \
            -configuration Release CODE_SIGNING_ALLOWED=NO
      - name: Package TrollStore variant
        run: |
          python3 TrollStoreJITLess/package.py "$RUNNER_TEMP/LiveContainer.xcarchive/Products/Applications/LiveContainer.app"
          python3 TrollStoreJITLess/verify-package.py Nextcloud-LiveContainer-TrollStore.tipa
      - name: Exercise ZSign and CoreTrust on iOS Mach-O fixtures
        run: bash TrollStoreJITLess/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Nextcloud-LiveContainer-TrollStore-experimental
          path: Nextcloud-LiveContainer-TrollStore.tipa
          if-no-files-found: error
